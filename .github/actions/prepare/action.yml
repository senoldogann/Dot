# What every job of the gate installs, once: the checkout, the locked environment, and the tools that job asks for.
# Ripgrep and Playwright's browsers are cached, so a run does not download either when a previous run already did.
# The cache holds those tools, not a build of Dot; a pull request's cache stays on that pull request.

name: Prepare
description: Check out the tree and install the locked environment, ripgrep and Playwright's browsers when asked

inputs:
  ripgrep:
    description: Install ripgrep, which the search tool runs
    required: false
    default: "false"
  browsers:
    description: Install Playwright's headless shell and WebKit
    required: false
    default: "false"
  node:
    description: Install Node and the interface tooling
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
    - name: Install
      shell: bash
      run: uv sync --frozen
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node == 'true'
      with:
        node-version: 22
        cache: npm
    # Biome and tsc need no package install script. A postinstall in a pull request's package.json must not
    # run on the runner: one did, and it ran a script checked in beside it.
    - name: Interface tooling
      if: inputs.node == 'true'
      shell: bash
      run: npm ci --ignore-scripts
    # The archive's own checksum, from the same release. Brew is not asked: it updates itself first, which some
    # runs spent a minute on, for a binary that does not change.
    - name: Ripgrep cache
      if: inputs.ripgrep == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/.ci/ripgrep
        key: ripgrep-15.2.0-${{ runner.os }}-${{ runner.arch }}
    - name: Ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        root="${GITHUB_WORKSPACE}/.ci/ripgrep"
        if [[ ! -x "$root/rg" ]]; then
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64) target=x86_64-apple-darwin ;;
            *) echo "::error::no ripgrep build for ${RUNNER_OS} ${RUNNER_ARCH}"; exit 1 ;;
          esac
          version=15.2.0
          archive="${RUNNER_TEMP}/ripgrep.tar.gz"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${version}/ripgrep-${version}-${target}.tar.gz"
          curl -fsSL -o "$archive" "$url"
          curl -fsSL -o "${archive}.sha256" "${url}.sha256"
          expected="$(awk 'NR==1 { print $1 }' "${archive}.sha256")"
          actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
          test "$expected" = "$actual"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1
        fi
        # /usr/local/bin is already on PATH. Writing GITHUB_PATH is what zizmor's github-env audit rejects, and the
        # directory above is only the cache.
        sudo install -m 755 "$root/rg" /usr/local/bin/rg
    # Playwright keeps its browsers beside the version of the package. The key follows the lock, and a miss falls
    # back to the previous browsers so the install below only fetches what changed.
    - name: Playwright browser cache
      if: inputs.browsers == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/.ci/playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Browsers
      if: inputs.browsers == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci/playwright
      run: uv run playwright install chromium-headless-shell webkit
