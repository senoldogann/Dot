# The iPhone app's checks (item 1850): DotNext (ios/Next) and its engine (ios/DotEngine) are built and tested here, on
# GitHub's macOS runners (free for a public repository), so the owner's Mac no longer queues helpers behind one Xcode
# and is left the final screenshots. ios/Next/README.md "CI" says how to read a run and fetch its screenshots.
#
# The jobs: `engine` runs `swift test` of the engine; `build` makes the project with XcodeGen, builds DotNext and its
# tests once (build-for-testing) and runs the String Catalog check on that build; `tests` runs the unit and UI tests
# from that build; `e2e` runs Settings end to end against a throwaway daemon of this checkout
# (scripts/e2e_settings.sh); `ios` is the one check that says all of them passed. Each test job keeps its .xcresult and
# the screenshots in it for 7 days.
#
# The account runs five macOS runners at once and the gate's own jobs need them, so a run holds two at most: `engine`
# beside `build`, then the `tests` parts two at a time (`max-parallel`), then `e2e` alone. A pull request runs `build`
# alone, and only when it changes ios/ or this file (item 1886 took macOS from pull requests, and a Swift compile error
# then reached main: one runner for about ten minutes catches it before the merge); the push to main that merges one
# runs `engine`, `build` and the `chat` part; the long parts (`controls`, `rows`) and `e2e` run every night and when
# asked (`gh workflow run ios.yml --ref <branch>`, a branch's whole run before its pull request merges). `main-health`
# keeps the issue "main is red on macOS" (item 1899, docs/development.md).
name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# The jobs only read the code: the token GitHub hands them can do nothing more.
permissions:
  contents: read

# A run of main is never stopped halfway; pushes that come meanwhile wait as one run, the newest, which tests them all.
# A pull request's run is stopped by its next push (its ref is the pull request's own), as only the newest build counts.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Xcode every job uses, from those the runner image holds (/Applications/Xcode_<version>.app). DotNext targets iOS
# 26 and the engine needs Swift tools 6.2; Xcode 26.1 failed at DotNext's asset catalog, 26.6 (the image's default)
# builds it.
env:
  XCODE: "26.6"
  SIMULATOR: "iPhone 17 Pro"
  # Whether this run is the whole one: the night's and one asked for.
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

# Each action is pinned by the commit its tag named when it was pinned, given in the comment (as in gate.yml).
jobs:
  engine:
    # Not in a pull request: it runs `build` alone.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: swift test
        working-directory: ios/DotEngine
        run: swift test

  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
      - name: XcodeGen
        run: brew install xcodegen && (cd ios && xcodegen generate)
      # Signed ad hoc (`-`): the simulator then gives the app its app group and Keychain group, as on the owner's Mac.
      - name: Build DotNext and its tests
        run: |
          xcodebuild build-for-testing -project ios/Dot.xcodeproj -scheme DotNext \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGN_IDENTITY=- -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1 || {
            grep -E "error:|warning: .*(fatal|failed)" "$RUNNER_TEMP/build.log" | sort -u | head -60; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E "\*\* .* \*\*" "$RUNNER_TEMP/build.log"
      - name: String Catalog
        run: ios/Next/scripts/check_strings.sh "$RUNNER_TEMP/dd"
      - name: Keep the build for the tests
        run: tar -C "$RUNNER_TEMP/dd/Build" -czf "$RUNNER_TEMP/products.tgz" Products
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnext-build
          path: ${{ runner.temp }}/products.tgz
          retention-days: 1

  tests:
    # After `engine` too, so that `engine` never runs beside two parts: two macOS runners at most.
    needs: [build, engine]
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 65
    # The parts by the time they took on the runner: the unit tests with the chat's and Settings' UI tests 12-15
    # minutes, each test of SettingsControlsUITests (it taps every row, and every control of every native page) 16-27.
    # The longest starts first; the third waits for one of the two to end.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["controls", "chat", "rows"]' || '["chat"]') }}
    name: tests (${{ matrix.part }})
    steps:
      # StringCatalogTests reads Resources/Localizable.xcstrings at its source path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnext-build
          path: ${{ runner.temp }}
      - name: Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          name = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return tuple(int(n) for n in re.search(r"iOS-(\d+)-(\d+)", key).groups())
          found = [(version(k), d["udid"]) for k, ds in devices.items() if ".iOS-2" in k for d in ds if d["name"] == name]
          print(max(found)[1])' "$SIMULATOR")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
      # A fresh simulator's first launch of an app is slow enough that XCTest's launch timed out once on the runner
      # ("Timed out while launching application via Xcode", run 45578426723): the app is installed and opened once
      # here, before any test, so the tests do not pay for it.
      - name: First launch
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p "$RUNNER_TEMP/dd/Build" && tar -C "$RUNNER_TEMP/dd/Build" -xzf "$RUNNER_TEMP/products.tgz"
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/DotNext.app"
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" dev.dotagent.phone.next
          sleep 10
          xcrun simctl terminate "$UDID" dev.dotagent.phone.next
      # Shorter than the job, so that a test that hangs still leaves its result and screenshots to the steps below, and
      # long enough for the longest part (24 minutes) to run twice. A failed test, unit or UI, runs once more: the
      # runner's simulator also failed once to start the UI test runner at all; a test that fails twice fails the part,
      # and each try is in the log.
      - name: Test
        timeout-minutes: 55
        env:
          PART: ${{ matrix.part }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          case "$PART" in
            chat) ONLY="-only-testing:DotNextTests -only-testing:DotNextUITests/ChatUITests -only-testing:DotNextUITests/ChatSettingsUITests -only-testing:DotNextUITests/SettingsUITests" ;;
            controls) ONLY="-only-testing:DotNextUITests/SettingsControlsUITests/testEveryControlOfTheNativePagesDoesSomething" ;;
            rows) ONLY="-only-testing:DotNextUITests/SettingsControlsUITests/testEveryRowOfSettingsOpensItsPage" ;;
            *) echo "no tests named for the part $PART" >&2; exit 2 ;;
          esac
          run=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          # shellcheck disable=SC2086
          xcodebuild test-without-building -xctestrun "$run" -destination "id=$UDID" $ONLY \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" | grep --line-buffered -E "error:|Test Case|Executed|TEST "
          test "${PIPESTATUS[0]}" -eq 0
      # A test that passed only on its retry is flaky: the job's summary names it, so the retry hides nothing.
      - name: Screenshots and retries out of the result
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/tests.xcresult/Info.plist" ] || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tests.xcresult" --output-path "$RUNNER_TEMP/shots"
          retried=$(python3 ios/Next/scripts/passed_on_retry.py "$RUNNER_TEMP/tests.xcresult")
          if [ -n "$retried" ]; then
            echo "$retried" | sed 's/^/::warning title=flaky::/'
            echo "$retried" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-tests-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/tests.xcresult
            ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    # After the tests, so alone, and whatever they gave: a whole run reports its end to end even when a part failed.
    needs: [build, tests]
    if: >-
      !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: The daemon's environment
        run: uv sync --locked
      - name: XcodeGen
        run: brew install xcodegen && (cd ios && xcodegen generate)
      - name: Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          name = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return tuple(int(n) for n in re.search(r"iOS-(\d+)-(\d+)", key).groups())
          found = [(version(k), d["udid"]) for k, ds in devices.items() if ".iOS-2" in k for d in ds if d["name"] == name]
          print(max(found)[1])' "$SIMULATOR")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
      # The script makes its folders with mktemp, under a TMPDIR of each try's own, so that the logs of a try (the
      # daemon's, xcodebuild's) are kept for the artifact; DOT_HOME and the others point at the runner's temp too, so
      # nothing it starts can reach a default home. It runs once more when the first try failed: on the runner the UI
      # test runner sometimes fails to start ("Timed out waiting for AX loaded notification", run 45569714390) before
      # any test ran. The second try starts a new daemon in new folders; a failure of both fails the job, and a pass on
      # the second is named in the job's summary.
      - name: Settings end to end
        timeout-minutes: 45
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          export DOT_HOME="$RUNNER_TEMP/home" DOT_LOG_DIR="$RUNNER_TEMP/logs" DOT_CHROME_DIR="$RUNNER_TEMP/chrome"
          mkdir -p "$RUNNER_TEMP/try1" "$RUNNER_TEMP/try2"
          if ! TMPDIR="$RUNNER_TEMP/try1" ios/Next/scripts/e2e_settings.sh "$UDID" "$RUNNER_TEMP/dd"; then
            echo "::warning title=e2e::the first try failed; trying once more"
            mv "$RUNNER_TEMP/dd/Logs/Test" "$RUNNER_TEMP/try1/xcresults" 2>/dev/null || true
            TMPDIR="$RUNNER_TEMP/try2" ios/Next/scripts/e2e_settings.sh "$UDID" "$RUNNER_TEMP/dd"
            echo "- passed on retry: the live Settings UI tests (e2e; the first try's logs are in the artifact ios-e2e, try1/)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Screenshots and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          find "$RUNNER_TEMP/try1" "$RUNNER_TEMP/try2" -maxdepth 2 -name '*.log' 2>/dev/null | while read -r log; do
            dest="$RUNNER_TEMP/e2e-logs/$(basename "$(dirname "$(dirname "$log")")")"
            mkdir -p "$dest" && cp "$log" "$dest/"
          done
          [ -d "$RUNNER_TEMP/try1/xcresults" ] && cp -R "$RUNNER_TEMP/try1/xcresults" "$RUNNER_TEMP/e2e-logs/try1/"
          result=$(find "$RUNNER_TEMP/dd/Logs/Test" -name '*.xcresult' -maxdepth 1 2>/dev/null | head -1)
          [ -n "$result" ] || exit 0
          cp -R "$result" "$RUNNER_TEMP/e2e.xcresult"
          xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-e2e
          path: |
            ${{ runner.temp }}/e2e.xcresult
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: ignore

  # The one check to read: it passes only when every job above passed, `e2e` skipped only in a run that is not the whole
  # one. In a pull request `build` is the one job that runs: `engine`, `tests` and `e2e` are skipped by design, and a
  # skipped one there is the pass; anywhere else a skipped `engine` or `tests` fails it.
  ios:
    if: always()
    needs: [engine, build, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          ENGINE: ${{ needs.engine.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "engine=$ENGINE build=$BUILD tests=$TESTS e2e=$E2E full=$FULL event=$EVENT"
          if [ "$EVENT" = pull_request ]; then
            [ "$BUILD" = success ] && [ "$ENGINE" = skipped ] && [ "$TESTS" = skipped ] && [ "$E2E" = skipped ] || exit 1
            exit 0
          fi
          [ "$ENGINE" = success ] && [ "$BUILD" = success ] && [ "$TESTS" = success ] || exit 1
          [ "$E2E" = success ] || { [ "$FULL" = false ] && [ "$E2E" = skipped ]; } || exit 1

  # After a push to main's run (item 1899): the issue "main is red on macOS" is opened, or told again, when this commit
  # failed here or in the gate, and closed when both passed (scripts/main_macos_green.py). Not for a run of the night or
  # by hand, whose commit main's own runs already told.
  main-health:
    needs: [ios]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: The issue of a red main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/main_macos_green.py report --sha "$SHA" --this-run "$RUN_ID"
