# The gate. A pull request runs its Linux jobs alone (item 1886): the format check, the lint, mypy, the checks of the
# interface, the item records and the unit tests but those that need macOS (item 1270; the marker on the PyObjC
# dependencies lets `uv sync` install there), and the desktop checks and zizmor when their files change. The account's
# five macOS runners were what pull requests waited on, one to two hours. The macOS jobs run on the push to main that
# merges a pull request, chosen by the files changed since main was last green: the unit tests Linux leaves out
# (`--macos-only`), `dotx eval check` and the smoke tests when the Python package can be affected
# (scripts/python_ci.py), and the core of the browser tests (item 486: the URL rules of Dot's Chrome, the sign-in, the
# secret fields, the attach mode and every phone page) when the web UI, the daemon or the browser code can be
# (scripts/browser_ci.py). So a break only macOS shows is seen on main, and fixed before anything else is merged; the
# job `main-health` keeps the issue "main is red on macOS" (item 1899). The release, which calls this gate, and a run
# by hand run every job; browser.yml runs every browser test each night. The smoke tests here are every one that needs
# no service, chosen by their marks: a scripted model or a stand-in plays the real loop, tools, policy and store; one
# that needs the local Ollama server's embedding model skips itself here. The tests marked live, internet, desktop or
# hosted stay on the developer's Mac.
name: gate

# A change to prose alone (the Markdown at the root, docs/, the issue and pull request templates) runs nothing heavy, as
# no command below reads it; but docs/freedom.md, which tests/unit/test_freedom_contract.py reads, and a skill's
# SKILL.md under src/, which Dot reads, do run the gate. The desktop shell's checks (desktop.yml) and zizmor's audit of
# the workflows (zizmor.yml) run from here for a pull request that changes what they read (item 1189), so that `ci`
# waits for them, and from their own workflows for a push to main.
#
# A pull request starts this workflow even when it changes prose alone: branch protection requires `ci`, and a workflow
# a path filter skips reports no check at all, so that pull request would wait on a check nothing would ever report. The
# `prose` job below reads the changed files instead, and every heavy job skips when they are prose alone. A push to main
# keeps the filter, where no protection waits on a check.
on:
  pull_request:
  push:
    branches: [main]
    # Everything but prose; a later pattern wins, so docs/freedom.md runs it.
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "docs/freedom.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/pull_request_template.md"
  # The release runs the whole gate again on the tagged commit before it publishes (release.yml, item 457), the core
  # of the browser tests with it (item 486); a call ignores the paths above, so the gate always runs whole there.
  workflow_call:
  # dependabot-merge.yml starts main's run after a merge it made (item 1190): a merge made with a workflow's token
  # starts no push run. A run started so runs whole, as a release's does.
  workflow_dispatch:

# The jobs only read the code: the token GitHub hands them can do nothing more.
permissions:
  contents: read

# Each action is pinned by the commit its tag named when it was pinned, given in the comment: a tag moved
# later cannot change what runs here.

# A new push to a pull request stops its run that is still going: that run checks a head no merge will take. A run of
# `main` (or of a release's tag) is never stopped halfway (item 1011): it is what shows two pull requests that pass
# alone and break `main` together. Merges that come while it runs wait as one run, the newest replacing the older
# waiting one, which checks every commit the older would have and more. The five macOS runners are the account's, not
# this repository's: a run stopped halfway had held them all for nothing.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The work is spread so a change waits on its slowest part. The checks run on Linux and take none of the five macOS
# runners. The unit tests and the first half of the smoke tests run here, the eval references and the second half in
# `smoke`, and the browser tests in three parts whose files were dealt by the time they took on run 42895911331
# (the pages part 12 minutes, the phone's two 6 and 4). The `ci` job is the one a required check can name: a browser
# part that this pull request skips reports no check of its own, and branch protection would wait for it forever.
jobs:
  # The one job a pull request that changes prose alone still runs: it reads the changed files and tells the heavy jobs
  # to skip. It applies the patterns the push filter names above. Anything it cannot read (no base sha, a base that will
  # not fetch, a diff that fails) counts as not prose, so a broken answer runs the gate rather than skipping it.
  prose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prose_only: ${{ steps.decide.outputs.prose_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Whether the change is prose alone
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          decide() { echo "prose_only=$1" >> "$GITHUB_OUTPUT"; }
          decide false
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "the base is not a sha; the gate runs"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE"; then
            echo "the base could not be fetched; the gate runs"
            exit 0
          fi
          if ! files="$(git diff --name-only --no-renames "$BASE" HEAD)"; then
            echo "the changed files could not be listed; the gate runs"
            exit 0
          fi
          prose=true
          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi
            case "$file" in
              # docs/freedom.md is read by a test (tests/unit/test_freedom_contract.py): it is not prose alone here.
              docs/freedom.md) prose=false ;;
              # The push filter's `docs/**` and templates first: `*.md` below would catch a file under docs/ too, and
              # it takes the root only.
              docs/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              *.md)
                if [[ "$file" == */* ]]; then
                  prose=false
                fi
                ;;
              *) prose=false ;;
            esac
          done <<< "$files"
          echo "changed files: $(printf '%s\n' "$files" | wc -l | tr -d ' ')"
          echo "prose alone: $prose"
          decide "$prose"

  checks:
    # A push and a release have no prose job and run everything; a pull request runs this when its change is more than
    # prose.
    needs: [prose]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.prose.outputs.prose_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Ripgrep too: the unit tests of the search run here, and the macOS job leaves them to this one.
      - uses: $/.github/actions/prepare
        with:
          node: true
          ripgrep: true
      # The release is one version. This fails in seconds, on Linux, before the macOS tests.
      - name: Versions
        run: uv run python scripts/check_versions.py
      # The maturity scorecard's shape (item 1857): the table reads, each feature once, each with how it was proven,
      # its date a day and never ahead. How old a proof is is checked by maturity.yml, never here.
      - name: Maturity
        run: uv run python scripts/check_maturity.py
      # A commit writes its own item's records and no other's (item 1265): the branch's commits are read against main's.
      - name: Item records
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --quiet --filter=blob:none origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            "+refs/pull/$PR/head:refs/remotes/origin/pr-head"
          uv run python scripts/check_item_records.py --base "origin/$BASE" --head origin/pr-head
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy src
      # The checks of the web interface (package.json): Biome, tsc over the JSDoc, the unit tests of its pure modules.
      # Node is a development requirement only; nothing of Dot needs it to run.
      - name: Interface checks
        run: npm run check
      # The unit tests on Linux (item 1270), where a cloud agent works: those that need macOS itself are left out
      # (tests/unit/conftest.py) and every other one runs, so that a module that loads AppKit, Quartz or a macOS-only
      # flag for a name or a type fails here, not on the agent's machine. macOS runs those left out, below.
      - name: Unit tests on Linux
        env:
          DOT_HOME: ${{ github.workspace }}/.ci/home
          DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
          DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
        run: |
          mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
          uv run pytest tests/unit -q -n auto -p no:cacheprovider

  # What of a pull request, or of a push to main (item 1886), can affect the macOS jobs of the gate, a browser part,
  # the desktop shell and the workflows. A pull request is read against its base. A push to main is read against the
  # commit of the gate's last run on main that passed: runs of main that wait replace one another (item 1011), so the
  # push before this one may never have run, and what changed since main was last green is what this run must test.
  # A release and a run started by hand do not ask, and run everything; so does a run whose answer cannot be read,
  # which is the failure that still tests the change. The release calls this gate from the push of its tag, so the
  # event alone does not tell main's push: the ref does. desktop.yml and zizmor.yml run on their own for a push.
  changes:
    needs: [prose]
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request'
      || github.event_name == 'push' && github.ref == 'refs/heads/main')
      && needs.prose.outputs.prose_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The runs of this workflow are read to find main's last green one.
    permissions:
      contents: read
      actions: read
    outputs:
      python: ${{ steps.decide.outputs.python }}
      browser: ${{ steps.decide.outputs.browser }}
      desktop: ${{ steps.decide.outputs.desktop }}
      workflows: ${{ steps.decide.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Which files run the gate's macOS jobs, the browser parts, the desktop checks and zizmor
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          decide() {
            {
              echo "browser=$1"
              echo "desktop=$2"
              echo "workflows=$3"
              echo "python=$4"
            } >> "$GITHUB_OUTPUT"
          }
          BASE="$PR_BASE"
          if [[ "$EVENT" == "push" ]]; then
            if ! BASE="$(gh api "repos/$REPO/actions/workflows/gate.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')"; then
              BASE=""
            fi
            echo "main's last green gate ran on: ${BASE:-none found}"
          fi
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "the base is not a sha; everything runs"
            decide true true true true
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE"; then
            echo "the base could not be fetched; everything runs"
            decide true true true true
            exit 0
          fi
          if ! files="$(git diff --name-only --no-renames "$BASE" HEAD)"; then
            echo "the changed files could not be listed; everything runs"
            decide true true true true
            exit 0
          fi
          # The desktop checks read desktop/ and their workflow, which the gate calls; zizmor reads all of .github/.
          desktop=false
          if printf '%s\n' "$files" | grep -qE '^(desktop/|\.github/workflows/(desktop|gate)\.yml$)'; then
            desktop=true
          fi
          workflows=false
          if printf '%s\n' "$files" | grep -q '^\.github/'; then
            workflows=true
          fi
          echo "desktop: $desktop, workflows: $workflows"
          # The browser answer of a push to main is read by no job (the parts skip main, item 1886); it is still told.
          # The gate's macOS jobs (scripts/python_ci.py): skipped only when every file is one nothing of them reads.
          if ! python="$(printf '%s\n' "$files" | python3 scripts/python_ci.py)"; then
            echo "the gate's macOS jobs: their check failed, so they run"
            python=true
          elif [[ "$python" != "true" && "$python" != "false" ]]; then
            echo "the gate's macOS jobs: their check gave no answer ($python), so they run"
            python=true
          else
            echo "the gate's macOS jobs: $python"
          fi
          if ! answer="$(printf '%s\n' "$files" | python3 scripts/browser_ci.py)"; then
            echo "the path check failed; the browser parts run"
            decide true "$desktop" "$workflows" "$python"
            exit 0
          fi
          if [[ "$answer" != "true" && "$answer" != "false" ]]; then
            echo "the path check gave no answer; the browser parts run"
            decide true "$desktop" "$workflows" "$python"
            exit 0
          fi
          decide "$answer" "$desktop" "$workflows" "$python"

  gate:
    # Not on a pull request (item 1886): it runs on the push to main that merges one. A push whose files nothing of
    # this job reads skips it (scripts/python_ci.py); a decision that failed or was not made (a release, a run by hand)
    # runs it.
    needs: [prose, changes]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOT_HOME: ${{ github.workspace }}/.ci/home
      DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
      DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
      # The runner's /etc/localtime is not a link into the zone database, so the zone is named here.
      TZ: UTC
    steps:
      - uses: $/.github/actions/prepare
        with:
          ripgrep: true
      - name: Throw-away home
        run: mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
      # Only the unit tests Linux leaves out (tests/unit/conftest.py: its list and the tests marked macos): `checks`
      # runs every other one, so each runs once.
      - name: Unit tests that need macOS
        run: uv run pytest tests/unit -q -n auto -p no:cacheprovider --macos-only
      # The smoke tests' files are dealt to two parts in turn (tests/smoke/conftest.py), the second in `smoke`.
      - name: Offline smoke tests, part 1
        run: >
          uv run pytest tests/smoke -q -n auto -p no:cacheprovider --part 1/2 --durations=10
          -m "not live and not browser and not internet and not desktop and not hosted"

  smoke:
    name: gate (part 2)
    # Not on a pull request (item 1886): it runs on the push to main that merges one. A push whose files nothing of
    # this job reads skips it (scripts/python_ci.py); a decision that failed or was not made (a release, a run by hand)
    # runs it.
    needs: [prose, changes]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true') }}
    runs-on: macos-latest
    # Room for one retry of the smoke tests below. A second failure still ends the job, inside this bound.
    timeout-minutes: 50
    env:
      DOT_HOME: ${{ github.workspace }}/.ci/home
      DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
      DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
      TZ: UTC
    steps:
      - uses: $/.github/actions/prepare
        with:
          ripgrep: true
      - name: Throw-away home
        run: mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
      - name: Eval references
        run: uv run dotx eval check
      - name: Offline smoke tests, part 2
        # One retry of the tests that failed (pytest's --last-failed, its cache under the runner's temp): the second
        # result is the job's, and a failure that is still there fails this job, and ci with it. Not continue-on-error.
        # A first run that recorded no failure (it broke before) runs every test again.
        run: |
          run_part() {
            uv run pytest tests/smoke -q -n auto -o cache_dir="$RUNNER_TEMP/pytest-cache" --part 2/2 --durations=10 \
              -m "not live and not browser and not internet and not desktop and not hosted" "$@"
          }
          if run_part; then
            exit 0
          fi
          echo "smoke part 2 failed once; running its failed tests once more. A second failure fails this job and ci."
          rm -rf "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
          mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
          run_part --last-failed --last-failed-no-failures all

  # The core of the browser tests (item 486), beside the gate, so that a red one hides nothing of the gate's: the files
  # whose names start test_browser_ and test_phone_ (new ones join by their names), the secret fields, the page guards
  # and the face. In three parts, on runners of their own, each on one worker: a runner has three cores and a worker
  # drives a Chrome and a daemon of its own, and at two or three workers pages ran out of their time. Run 42895911331
  # spent 12m14s in the pages part. Run 42926928204, after the attach mode and the secret fields had moved to the
  # second phone part, spent 5m44s of tests in pages, 8m54s in the first phone part and 7m29s in the second: the
  # settings file was four of that first part's ten slowest calls, on top of the walk through every page (3m25s by
  # itself), so the settings went back to pages. A new browser file still joins pages and a new phone file the second
  # part. A phone back on a network that wakes measures seconds of grace against the runner's own clock, which a slow
  # runner does not keep: it runs at night (browser.yml) and on the developer's Mac. Run 45657128269's tests' times
  # (its browser-times artifacts) were 9.6 minutes in pages, 7.4 in the first phone part and 12.5 in the second, so the
  # phone's type, fit and back files (2.7 minutes) moved to the first (item 1886).
  browser:
    name: browser (${{ matrix.part.name }})
    needs: [changes, prose]
    # Not on a pull request (item 1886): the parts run on the push to main that merges one, when its files (those
    # changed since main was last green) can affect them (scripts/browser_ci.py), and browser.yml runs every browser
    # test each night and when asked. A decision that failed or was not made (a release, a run by hand) runs the parts,
    # so a broken check cannot hide a break.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: pages
            tests: >-
              tests/smoke/test_browser_*.py tests/smoke/test_page_guards.py tests/smoke/test_face.py
              --deselect tests/smoke/test_browser_attach.py --deselect tests/smoke/test_browser_data.py
          - name: phone 1
            tests: >-
              tests/smoke/test_phone_all_pages.py tests/smoke/test_phone_screens.py tests/smoke/test_phone_reach.py
              tests/smoke/test_phone_rows.py tests/smoke/test_phone_lists.py tests/smoke/test_phone_pages.py
              tests/smoke/test_browser_data.py tests/smoke/test_phone_type.py tests/smoke/test_phone_fit.py
              tests/smoke/test_phone_back.py
          - name: phone 2
            tests: >-
              tests/smoke/test_phone_*.py tests/smoke/test_browser_attach.py tests/smoke/test_secret_fields.py
              --deselect tests/smoke/test_phone_all_pages.py --deselect tests/smoke/test_phone_screens.py
              --deselect tests/smoke/test_phone_reach.py --deselect tests/smoke/test_phone_rows.py
              --deselect tests/smoke/test_phone_lists.py --deselect tests/smoke/test_phone_pages.py
              --deselect tests/smoke/test_phone_type.py --deselect tests/smoke/test_phone_fit.py
              --deselect tests/smoke/test_phone_back.py
              --deselect
              tests/smoke/test_phone_return.py::test_a_phone_back_from_the_background_keeps_its_chat_still_while_the_network_wakes
    runs-on: macos-latest
    # Room for one retry of the browser tests below. A second failure still ends the part, inside this bound.
    timeout-minutes: 70
    env:
      DOT_HOME: ${{ github.workspace }}/.ci/home
      DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
      DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
      TZ: UTC
      # Where Playwright keeps the browsers the prepare step cached, so the tests find the same ones.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci/playwright
      # The part's files, globs the shell expands.
      PART_TESTS: ${{ matrix.part.tests }}
    steps:
      - uses: $/.github/actions/prepare
        with:
          ripgrep: true
          browsers: true
      - name: The runner
        run: sysctl -n hw.ncpu hw.memsize
      - name: Throw-away home
        run: mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
      - name: Core browser tests
        # PART_TESTS is split into its globs on purpose. One retry of the tests that failed (pytest's --last-failed,
        # its cache under the runner's temp; a first run that recorded no failure runs every test again): a flaky test
        # of the pages part had made it run its 149 tests twice, 20 minutes in place of 10, in three runs of six. The
        # second result is the part's: a failure that is still there fails this part, and ci with it. Not
        # continue-on-error. Each test's time goes to a JUnit file, kept for the parts' next sharing out.
        run: |
          run_part() {
            # PART_TESTS is split into its globs on purpose.
            uv run pytest -q -o cache_dir="$RUNNER_TEMP/pytest-cache" --durations=15 \
              -m "browser and not live and not internet and not hosted and not desktop" \
              $PART_TESTS "$@"
          }
          if run_part --junitxml="$RUNNER_TEMP/junit/first.xml"; then
            exit 0
          fi
          echo "browser tests failed once; running the failed ones once more. A second failure fails this job and ci."
          rm -rf "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
          mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
          run_part --last-failed --last-failed-no-failures all --junitxml="$RUNNER_TEMP/junit/retry.xml"
      - name: The tests' times
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-times-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit
          retention-days: 14
          if-no-files-found: ignore

  # The desktop shell's checks (desktop.yml) for a pull request that changes desktop/ or their workflow (item 1189).
  # Called from here rather than started by their own path filter, so that `ci`, the check main's protection requires,
  # waits for them and no merge goes through with them red. A push to main runs desktop.yml on its own. A decision that
  # failed runs them.
  desktop:
    needs: [changes, prose]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && needs.prose.outputs.prose_only != 'true'
      && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    uses: $/.github/workflows/desktop.yml

  # zizmor's audit of the workflows and Dependabot's file (zizmor.yml, item 487) for a pull request that changes
  # .github/, for the same reason as the desktop checks: `ci` waits for it. A push to main, the week and a demand run
  # zizmor.yml on its own.
  zizmor:
    needs: [changes, prose]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && needs.prose.outputs.prose_only != 'true'
      && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    uses: $/.github/workflows/zizmor.yml

  # The check main's protection should require, in place of the job names. It passes when every job it waits for
  # passed or did not run, and fails when one failed: a skipped browser part, desktop check or audit is not a failure,
  # and a red one is. A pull request that changes prose alone reaches it with every heavy job skipped, and passes.
  ci:
    needs: [prose, checks, gate, smoke, browser, desktop, zizmor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed, or did not run
        env:
          PROSE: ${{ needs.prose.result }}
          CHECKS: ${{ needs.checks.result }}
          GATE: ${{ needs.gate.result }}
          SMOKE: ${{ needs.smoke.result }}
          BROWSER: ${{ needs.browser.result }}
          DESKTOP: ${{ needs.desktop.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          fail=0
          for name in PROSE CHECKS GATE SMOKE BROWSER DESKTOP ZIZMOR; do
            result="${!name}"
            echo "$name $result"
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"
