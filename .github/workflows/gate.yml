# The gate every change passes before it is merged: the same commands as CONTRIBUTING.md, on macOS because the
# package depends on PyObjC. The smoke tests here are every one that needs no service, chosen by their marks: a scripted
# model or a stand-in plays the real loop, tools, policy and store. The tests marked live, browser, internet, desktop or
# hosted stay on the developer's Mac; one that needs the local Ollama server's embedding model skips itself here.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the code: the token GitHub hands them can do nothing more.
permissions:
  contents: read

# Each action is pinned by the commit its tag (or branch) named when it was pinned, given in the comment: a tag moved
# later cannot change what runs here.

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOT_HOME: ${{ github.workspace }}/.ci/home
      DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
      DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
      # The runner's /etc/localtime is not a link into the zone database, so the zone is named here.
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      # The search tool runs ripgrep; the runner image has Homebrew but not rg.
      - name: Ripgrep
        run: brew install ripgrep
      - name: Throw-away home
        run: mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest tests/unit -q -p no:cacheprovider
      - name: Eval references
        run: uv run dotx eval check
      - name: Offline smoke tests
        run: >
          uv run pytest tests/smoke -q -p no:cacheprovider
          -m "not live and not browser and not internet and not desktop and not hosted"

  # The desktop shell (desktop/): the Rust compiles, is clean and passes its tests; the bundle itself is built on the
  # owner's Mac.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Format
        run: cargo fmt --check
        working-directory: desktop/src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: Test
        run: cargo test
        working-directory: desktop/src-tauri
