# Every week the dependencies as locked (uv.lock, desktop/src-tauri/Cargo.lock) are checked against the public
# advisories: pip-audit asks PyPI's database, cargo audit the RustSec database. A known vulnerability fails the job, so
# GitHub says so; nothing is changed or opened here. It runs on demand too.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# The jobs only read the code: the token GitHub hands them can do nothing more.
permissions:
  contents: read

# Each action is pinned by the commit its tag named when it was pinned, given in the comment, as in
# gate.yml; each tool by its version.

jobs:
  python:
    # On macOS, where the package's macOS-only dependencies (PyObjC) are among the requirements too.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes nothing: the checkout's token is not left in .git/config (item 487).
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The lock as requirements pinned with their hashes, which pip-audit checks as they are, resolving nothing.
      - name: Requirements
        run: uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes nothing: the checkout's token is not left in .git/config (item 487).
          persist-credentials: false
      # The runner's own rustup, rather than an action: the branch the action was pinned by is rewritten, so the commit
      # it named belongs to no branch of its repository any more (zizmor's impostor-commit, item 487).
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit
        run: cargo audit
        working-directory: desktop/src-tauri
