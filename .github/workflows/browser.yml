# Every browser test (item 486): the smoke tests marked browser, against local pages and a local daemon, in Google
# Chrome (on the runner's image), Playwright's headless shell and WebKit (the phone's engine). Every night and on demand
# (`gh workflow run browser.yml --ref <branch>` runs them on a branch); the core of them runs on every change and before
# a release, beside the gate (gate.yml). Nothing is changed or opened here: a red night is GitHub's to show.
name: browser

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

# The job only reads the code: the token GitHub hands it can do nothing more.
permissions:
  contents: read

# Each action is pinned by the commit its tag named when it was pinned, given in the comment (as in gate.yml).

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: macos-latest
    # Every browser test on one worker, as each part of the gate's core runs (gate.yml says why): hours, at night.
    timeout-minutes: 330
    env:
      DOT_HOME: ${{ github.workspace }}/.ci/home
      DOT_LOG_DIR: ${{ github.workspace }}/.ci/logs
      DOT_CHROME_DIR: ${{ github.workspace }}/.ci/chrome
      # The runner's /etc/localtime is not a link into the zone database, so the zone is named here.
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Browsers
        run: uv run playwright install chromium-headless-shell webkit
      - name: Ripgrep
        run: brew install ripgrep
      - name: The runner
        run: sysctl -n hw.ncpu hw.memsize
      - name: Throw-away home
        run: mkdir -p "$DOT_HOME" "$DOT_LOG_DIR" "$DOT_CHROME_DIR"
      - name: Browser tests
        run: >
          uv run pytest tests/smoke -q -p no:cacheprovider --durations=20
          -m "browser and not live and not internet and not hosted and not desktop"
