# The findings of zizmor (zizmor.yml, item 487) that are accepted, each with why. A fix is preferred.
rules:
  self-repository:
    ignore:
      # The release's gate, named as a reusable workflow at a job's level: GitHub reads it from the commit the release
      # runs for, never from a runner's files, so the state this audit guards against cannot reach it; and the release
      # runs only for a tag, so GitHub's new $/ form there would first be tried by a release.
      - release.yml:44
