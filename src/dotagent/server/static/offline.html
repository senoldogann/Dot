<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <title>Dot is out of reach</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/touch-icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/themes.css">
</head>
<body>
  <main class="signin">
    <div class="card">
      <div class="stack">
        <div class="signin-mark">
          <svg class="wordmark" viewBox="-104 -184 600 288" role="img" aria-label="Dot">
            <defs>
              <radialGradient id="mark-obsidian" cx="0.34" cy="0.28" r="0.8"><stop offset="0" stop-color="#5a5a5e"/><stop offset="0.32" stop-color="#1c1c1f"/><stop offset="1" stop-color="#000000"/></radialGradient>
              <linearGradient id="mark-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c1"/><stop offset="0.45" stop-color="#e6c26b"/><stop offset="1" stop-color="#a8782b"/></linearGradient>
              <radialGradient id="mark-shine" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            </defs>
            <path class="wordmark-letter wordmark-d" d="M83 -163V83M83 0A83 83 0 1 1 -83 0A83 83 0 1 1 83 0"/>
            <g transform="translate(244 0)">
              <g class="wordmark-dot">
                <circle class="mark-disc" r="100"/>
                <g class="mark-eye"><path d="M-10.5 -11.5a10.5 10.5 0 0 1 21 0v23a10.5 10.5 0 0 1 -21 0z" transform="matrix(1.098 -0.112 0.101 1.109 -17.3 -9.14)"/></g>
                <g class="mark-eye"><path d="M-10.5 -11.5a10.5 10.5 0 0 1 21 0v23a10.5 10.5 0 0 1 -21 0z" transform="matrix(1.030 -0.045 0.101 1.109 37.32 -13.26)"/></g>
                <ellipse class="mark-shine" cx="-38" cy="-50" rx="34" ry="18" transform="rotate(-32 -38 -50)"/>
                <circle class="mark-rim" r="99"/>
              </g>
            </g>
            <path class="wordmark-letter wordmark-t" d="M413 -133V36A47 47 0 0 0 460 83H476M383 -83H469"/>
          </svg>
        </div>
        <h1 class="page-title">Dot cannot reach your Mac right now</h1>
        <p class="muted">Check that your Mac is on and awake and that Dot is open on it, then try again.</p>
        <p class="muted">This page is saved on this device for times like this. The rest of Dot opens as soon as your
          Mac answers.</p>
        <div class="cluster">
          <a class="btn primary" href="/">Try again</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
