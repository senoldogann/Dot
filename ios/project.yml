# XcodeGen spec of Dot's iPhone shell. `xcodegen generate` writes Dot.xcodeproj (gitignored) from this file.
name: Dot
options:
  bundleIdPrefix: dev.dotagent
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: 79DZ4AA4DW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The daemon's tailnet host (e.g. mac.tailnet.ts.net), known at build time. Empty: the owner types it in the app
    # and the app enforces the single origin itself. Set: it becomes the app's only WKAppBoundDomains entry and the
    # web view is limited to it by WebKit too (see scripts/app_bound_domains.sh).
    DOT_HOST: ""
    # The APNs environment of the app's entitlement, read back by the app to tell the daemon where its tokens belong:
    # `development` (the sandbox) for an install from Xcode; `production` once a production key and profile exist.
    APS_ENVIRONMENT: development

packages:
  DotEngine:
    path: DotEngine

targets:
  Dot:
    type: application
    platform: iOS
    sources:
      - path: Dot
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone
        PRODUCT_NAME: Dot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app-bound domain script edits the built Info.plist in place, which the script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Dot/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # An iPhone app that turns with the phone but not upside down: full screen, so Xcode does not ask for every
        # orientation (that is for an iPad's split view).
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.dotagent.phone.refresh
        DotApsEnvironment: $(APS_ENVIRONMENT)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSMicrophoneUsageDescription: Dot listens while you dictate a message, and only then. The words are written on this iPhone; no audio is sent anywhere.
        NSSpeechRecognitionUsageDescription: Dot turns your voice into the words of a message on this iPhone when you press the microphone.
        CFBundleURLTypes:
          - CFBundleURLName: dev.dotagent.phone
            CFBundleURLSchemes:
              - dotagent
        NSCameraUsageDescription: Dot uses the camera when you take a photo to send to it.
        NSPhotoLibraryUsageDescription: Dot opens your photos when you choose one to send to it.
        NSPhotoLibraryAddUsageDescription: Dot saves an image to your photos when you ask it to.
    entitlements:
      path: Dot/Dot.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone
    dependencies:
      - target: DotLiveActivity
      - target: DotShare
    # After the extension is embedded: processing the Info.plist waits for the embedded extension.
    postBuildScripts:
      - name: App-bound domain from DOT_HOST
        script: '"${SRCROOT}/scripts/app_bound_domains.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/app_bound_domains.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/app_bound_domains.stamp
    scheme:
      testTargets:
        - DotTests

  # Unit tests of the native app's pure parts (event reducer, SSE parser, cache, queue order, link style).
  DotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DotTests
    dependencies:
      - target: Dot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  # Taps and screenshots in the simulator against a scratch daemon (`/tmp/dot-ui-daemon.json`, see ios/README.md); the
  # `DotUI` scheme runs them, the `Dot` scheme (the unit tests) does not.
  DotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DotUITests
    dependencies:
      - target: Dot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  DotLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: DotLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.live
        PRODUCT_NAME: DotLiveActivity
        SKIP_INSTALL: YES
    info:
      path: DotLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DotLiveActivity/DotLiveActivity.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone

  # The share sheet's Dot (item 1009): what another app shares goes to Dot as a new chat, with the app's host and key.
  DotShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DotShare
      - path: Dot/Adapters/Stores.swift
      - path: Dot/Adapters/DaemonClient.swift
      - path: Dot/Core/DaemonHost.swift
      - path: Dot/Core/Policy.swift
      - path: Shared/DotPalette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.share
        PRODUCT_NAME: DotShare
        SKIP_INSTALL: YES
    info:
      path: DotShare/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4
    entitlements:
      path: DotShare/DotShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone

  # The rewrite (plan 2026-11-24, ios/Next/README.md): its own bundle id, app group, Keychain group and URL scheme so
  # it installs beside the old app; iOS 26, iPhone and iPad.
  DotNext:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Next
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "scripts/**"
          - "README.md"
      - path: Shared/DotFleetAttributes.swift
      - path: Shared/DotDeepLink.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.next
        PRODUCT_NAME: DotNext
        TARGETED_DEVICE_FAMILY: "1,2"
        # Every user-visible string is in Next/Resources/Localizable.xcstrings with a required Turkish translation;
        # the compiler writes the keys it finds (.stringsdata) for scripts/check_strings.sh.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Next/Info.plist
      properties:
        CFBundleDisplayName: Dot Next
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        DotApsEnvironment: $(APS_ENVIRONMENT)
        NSSupportsLiveActivities: true
        NSSupportsFrequentLiveActivityUpdates: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Loopback only (the debug build's end-to-end check against a throwaway daemon on this Mac); the Mac is
        # reached over the tailnet's HTTPS otherwise.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Dot uses the camera to attach photos, videos and scanned pages, and to read your Mac’s pairing code.
        NSMicrophoneUsageDescription: Dot uses the microphone when you dictate a message or record a video to attach. Dictation runs on this iPhone or on your Mac, as selected in Settings › Voice.
        NSPhotoLibraryUsageDescription: Dot opens your photo library when you choose a photo or video to attach.
        NSSpeechRecognitionUsageDescription: Dot turns your voice into the words of a message on this iPhone when you press the microphone.
        CFBundleURLTypes:
          - CFBundleURLName: dev.dotagent.phone.next
            CFBundleURLSchemes:
              - dotnext
    dependencies:
      - package: DotEngine
      - target: DotNextLiveActivity
    entitlements:
      path: Next/DotNext.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone.next
        com.apple.security.application-groups:
          - group.dev.dotagent.phone.next
    scheme:
      testTargets:
        - DotNextTests
        - DotNextUITests
        - package: DotEngine/DotEngineTests

  DotNextLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NextLiveActivity
      - path: Shared/DotFleetAttributes.swift
      - path: Shared/DotDeepLink.swift
      - path: Next/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: DotEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.next.liveactivity
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: NextLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Dot Next
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The chat's UI tests (wave N2): the ask dock and the queue's edit on the debug build's fixtures.
  DotNextUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Next/UITests
    dependencies:
      - target: DotNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.next.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DotNext
  # Unit tests of DotNext's pure parts: the palette's contrast, the type rhythm, the reading column, component rules.
  DotNextTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Next/Tests
    dependencies:
      - target: DotNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.next.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  DotUI:
    build:
      targets:
        Dot: all
        DotUITests: [test]
    test:
      config: Debug
      targets:
        - DotUITests
