# XcodeGen spec of Dot's iPhone shell. `xcodegen generate` writes Dot.xcodeproj (gitignored) from this file.
name: Dot
options:
  bundleIdPrefix: dev.dotagent
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: 79DZ4AA4DW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The daemon's tailnet host (e.g. mac.tailnet.ts.net), known at build time. Empty: the owner types it in the app
    # and the app enforces the single origin itself. Set: it becomes the app's only WKAppBoundDomains entry and the
    # web view is limited to it by WebKit too (see scripts/app_bound_domains.sh).
    DOT_HOST: ""
    # The APNs environment of the app's entitlement, read back by the app to tell the daemon where its tokens belong:
    # `development` (the sandbox) for an install from Xcode; `production` once a production key and profile exist.
    APS_ENVIRONMENT: development

targets:
  Dot:
    type: application
    platform: iOS
    sources:
      - path: Dot
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone
        PRODUCT_NAME: Dot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app-bound domain script edits the built Info.plist in place, which the script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Dot/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # An iPhone app that turns with the phone but not upside down: full screen, so Xcode does not ask for every
        # orientation (that is for an iPad's split view).
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        DotApsEnvironment: $(APS_ENVIRONMENT)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSMicrophoneUsageDescription: Dot records your voice when you speak a message to it.
        NSCameraUsageDescription: Dot uses the camera when you take a photo to send to it.
        NSPhotoLibraryUsageDescription: Dot opens your photos when you choose one to send to it.
        NSPhotoLibraryAddUsageDescription: Dot saves an image to your photos when you ask it to.
    entitlements:
      path: Dot/Dot.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone
    dependencies:
      - target: DotLiveActivity
      - target: DotShare
    # After the extension is embedded: processing the Info.plist waits for the embedded extension.
    postBuildScripts:
      - name: App-bound domain from DOT_HOST
        script: '"${SRCROOT}/scripts/app_bound_domains.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/app_bound_domains.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/app_bound_domains.stamp
    scheme:
      testTargets: []

  DotLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: DotLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.live
        PRODUCT_NAME: DotLiveActivity
        SKIP_INSTALL: YES
    info:
      path: DotLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DotLiveActivity/DotLiveActivity.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone

  # The share sheet's Dot (item 1009): what another app shares goes to Dot as a new chat, with the app's host and key.
  DotShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DotShare
      - path: Dot/Adapters/Stores.swift
      - path: Dot/Adapters/DaemonClient.swift
      - path: Dot/Core/DaemonHost.swift
      - path: Dot/Core/Policy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dotagent.phone.share
        PRODUCT_NAME: DotShare
        SKIP_INSTALL: YES
    info:
      path: DotShare/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4
    entitlements:
      path: DotShare/DotShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.dotagent.phone
        com.apple.security.application-groups:
          - group.dev.dotagent.phone
