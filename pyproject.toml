[project]
name = "dotagent-macos"
version = "0.1.0"
description = "Dot: an always-on autonomous agent for macOS with browser and computer use, on models from Ollama, OpenAI, OpenCode Go, Anthropic, OpenRouter or OpenCode Zen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["agent", "autonomous agent", "macos", "llm", "browser automation", "computer use", "mcp", "ollama"]
# Dot runs on macOS alone: it depends on PyObjC and drives macOS's own applications.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "croniter>=6.2.4",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.1",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-screencapturekit>=12.2.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/senoldogann/Dot"
Documentation = "https://github.com/senoldogann/Dot/tree/main/docs"
Issues = "https://github.com/senoldogann/Dot/issues"
Changelog = "https://github.com/senoldogann/Dot/blob/main/CHANGELOG.md"

[project.scripts]
dotx = "dotagent.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# The distribution is dotagent-macos on PyPI ("dotagent" was taken, item 348); the package it installs stays dotagent.
[tool.uv.build-backend]
module-name = "dotagent"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ASYNC", "SIM", "RUF", "PLE", "PLW"]
ignore = ["RUF001", "RUF002", "RUF003", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# The timeout parameter of the connection methods is dictated by the httpcore network backend interface.
"src/dotagent/web/client.py" = ["ASYNC109"]
# The stop words are kept as one block of text that is split into words once.
"src/dotagent/memory/words.py" = ["SIM905"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "Quartz.*",
    "ApplicationServices.*",
    "AppKit.*",
    "Foundation.*",
    "CoreFoundation.*",
    "ScreenCaptureKit.*",
    "CoreMedia.*",
    "objc.*",
    "croniter.*",
    "py_vapid.*",
    "pywebpush.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/unit and tests/smoke have modules of the same name, so each is imported by its path; a smoke test that borrows
# from another finds it on tests/smoke. A mark that is not registered below fails, as a mistyped one would select a
# test that needs a service.
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["tests/smoke"]
markers = [
    "live: needs a running Ollama server with a signed-in cloud model",
    "browser: drives a real headless Chrome against a local fixture server",
    "internet: sends a few read-only requests to public sites (a search page and a documentation page)",
    "desktop: moves the real pointer and keyboard of this Mac against a local AppKit fixture window",
    "hosted: sends a few tiny requests to the real OpenAI, OpenCode Go, Anthropic and Ollama search services with your own keys, and to Zen's free models through the opencode program",
]
