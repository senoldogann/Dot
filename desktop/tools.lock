# The tools the desktop app carries (item 575), pinned: uv installs Dot's Python package on a Mac that has no terminal
# setup, and ripgrep is what Dot's search runs. desktop/fetch-tools.sh downloads each archive, reads it once (the same
# bytes are hashed and unpacked) and stops unless the SHA-256 of the archive is the one pinned here AND the SHA-256 of
# the program unpacked from it is the one pinned here, and makes one universal program of the two architectures, each
# half of which must still be that program. To raise a version: change the version, the address and both SHA-256s of
# both architectures together (each project publishes a .sha256 of its archives beside them; the program's is
# `shasum -a 256` of the file unpacked from the archive you checked), run `desktop/release.sh --check-tools`, and say
# why in the commit.
