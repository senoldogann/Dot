[package]
name = "dot-desktop"
version = "0.1.0"
description = "The desktop shell of Dot: a native window, a menu bar item and notifications around the web UI the daemon serves."
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "dot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
