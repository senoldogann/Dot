# The Rust the desktop shell is checked and built with (item 1189), on the CI (desktop.yml, audit.yml) and on the Mac,
# where rustup's `cargo` installs it the first time it runs here. A new stable release once turned the checks red with
# no change of Dot's own (1.100.0's clippy, run 43344986715); Dependabot now raises this version in a pull request,
# which the desktop checks pass or stop. The release builds the app for both kinds of Mac (desktop/release.sh), so the
# standard library of each comes with this version.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
profile = "minimal"
