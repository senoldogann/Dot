<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Dot</title>
  <link rel="stylesheet" href="down.css">
</head>
<body>
  <main data-tauri-drag-region>
    <svg class="wordmark" viewBox="-104 -184 600 288" width="132" role="img" aria-label="Dot">
      <path class="letter" d="M83 -163V83M83 0A83 83 0 1 1 -83 0A83 83 0 1 1 83 0"/>
      <g transform="translate(244 0)">
        <circle class="disc" r="100"/>
        <path class="eye" d="M-10.5 -11.5a10.5 10.5 0 0 1 21 0v23a10.5 10.5 0 0 1 -21 0z" transform="matrix(1.098 -0.112 0.101 1.109 -17.3 -9.14)"/>
        <path class="eye" d="M-10.5 -11.5a10.5 10.5 0 0 1 21 0v23a10.5 10.5 0 0 1 -21 0z" transform="matrix(1.030 -0.045 0.101 1.109 37.32 -13.26)"/>
      </g>
      <path class="letter" d="M413 -133V36A47 47 0 0 0 460 83H476M383 -83H469"/>
    </svg>
    <h1>Dot is not running</h1>
    <p class="why" hidden></p>
    <p class="start">The daemon that does the work is off. Start it once and it stays on, at every login and after a crash:</p>
    <pre class="start">dotx service install</pre>
    <p class="start muted">In a clone of Dot, write <code>uv run dotx service install</code>.</p>
    <p class="muted">This window opens the web UI by itself as soon as the daemon answers.</p>
  </main>
  <script src="down.js"></script>
</body>
</html>
